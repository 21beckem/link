<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <script type="module">
import { classifyUrl, errorLink, openLink, MISSING_URL, BROWSER_OPENS_DIRECTLY, BROWSER_LAUNCHES } from './script.js';

(async()=>{
    const toLink = new URLSearchParams(location.search).get('to');
    if (!toLink)
        return location.href = errorLink(MISSING_URL);

    const type = classifyUrl(toLink);

    if (type === BROWSER_OPENS_DIRECTLY)
        return openLink(toLink);

    if (type === BROWSER_LAUNCHES) {
        openLink(toLink);
        await new Promise(r=>setTimeout(r, 100));
        openLink('about:blank');
        return;
    }

    openLink( errorLink(type) );
})();
    </script>
</body>
</html>
